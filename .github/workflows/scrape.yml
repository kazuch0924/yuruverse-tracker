name: daily-scrape

on:
  schedule:
    # ランキングは毎日12時頃(JST)更新。GitHub の無料スケジューラは実測で毎日 1〜11 時間（通常 4〜5 時間）遅れ、
    # しかも同じ日の遅れ幅はほぼ一定なので、朝 6 時から正午まで 15 分刻みで予約しておくと、
    # 遅れて着弾した結果「正午すぎ」に走る回が必ずどこかにできる。
    # 正午前に走った回はサイト未更新なので何もせず終わる（scrape.py の日付ロジックとガード）。
    # 各回 25 秒程度・公開リポジトリは無料なのでコストはない。
    # --- 早朝（大きく遅れる日の保険）JST 01:37 / 03:37 / 05:07 ---
    - cron: "37 16 * * *"
    - cron: "37 18 * * *"
    - cron: "7 20 * * *"
    # --- JST 06:07〜11:52 を 15 分刻み（UTC 21:07〜02:52）---
    - cron: "7,22,37,52 21 * * *"
    - cron: "7,22,37,52 22 * * *"
    - cron: "7,22,37,52 23 * * *"
    - cron: "7,22,37,52 0 * * *"
    - cron: "7,22,37,52 1 * * *"
    - cron: "7,22,37,52 2 * * *"
    # --- JST 12:07〜13:52 を 15 分刻み（遅れが小さい日用）---
    - cron: "7,22,37,52 3 * * *"
    - cron: "7,22,37,52 4 * * *"
    # --- 午後〜夜の保険 JST 14:22 / 16:22 / 19:22 / 22:22 ---
    - cron: "22 5 * * *"
    - cron: "22 7 * * *"
    - cron: "22 10 * * *"
    - cron: "22 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 試行が重なっても同時に走らせない（push の競合防止）
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ゆるバース2026は10/3-4の決選投票で終了。最終結果の反映を見込んで 10/15 まで動かし、以降は自動停止する
      - name: Check end date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -gt 20261015 ]; then
            echo "開催期間終了のためワークフローを無効化します"
            gh workflow disable daily-scrape -R ${{ github.repository }}
            exit 1
          fi

      - name: Scrape and build
        run: |
          python3 scrape.py
          python3 build_site.py

      - name: Commit and push
        run: |
          git config user.name "yuruverse-bot"
          git config user.email "actions@users.noreply.github.com"
          commit_if_changed() {
            # SQLite は書き込むたびにヘッダが変わるので、実データが変わったかは生成HTMLで判定する
            if git diff --quiet -- docs/index.html; then
              echo "データに変化なし（既に最新）"
              return 1
            fi
            git add data/yuruverse.sqlite docs/index.html
            git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d') snapshot"
          }
          commit_if_changed || exit 0
          git push && exit 0
          # Mac 側が先に push していた場合: データ2ファイルは再生成できるので上流に合わせてから取り直し、差分があれば再コミット
          echo "push が拒否されたため上流に合わせて取り直します"
          git fetch origin main
          git reset --hard origin/main
          python3 scrape.py && python3 build_site.py
          commit_if_changed || { echo "上流が既に最新のため push 不要"; exit 0; }
          git push
