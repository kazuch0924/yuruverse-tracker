name: daily-scrape

on:
  schedule:
    # ランキングは毎日12時頃更新。GitHubのcronは混雑時に数十分〜数時間遅れる/取りこぼすため、
    # 12時台〜夕方まで何度も試行する。データに変化がない回はコミットしないので無駄は出ない。
    # (JST 12:07 / 12:22 / 12:37 / 12:52 / 13:22 / 14:22 / 16:22 / 19:22)
    - cron: "7 3 * * *"
    - cron: "22 3 * * *"
    - cron: "37 3 * * *"
    - cron: "52 3 * * *"
    - cron: "22 4 * * *"
    - cron: "22 5 * * *"
    - cron: "22 7 * * *"
    - cron: "22 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 試行が重なっても同時に走らせない（push の競合防止）
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ゆるバース2026は10/3-4の決選投票で終了。最終結果の反映を見込んで 10/15 まで動かし、以降は自動停止する
      - name: Check end date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -gt 20261015 ]; then
            echo "開催期間終了のためワークフローを無効化します"
            gh workflow disable daily-scrape -R ${{ github.repository }}
            exit 1
          fi

      - name: Scrape and build
        run: |
          python3 scrape.py
          python3 build_site.py

      - name: Commit and push
        run: |
          git config user.name "yuruverse-bot"
          git config user.email "actions@users.noreply.github.com"
          # SQLite は書き込むたびにヘッダが変わるので、実データが変わったかは生成HTMLで判定する
          if git diff --quiet -- docs/index.html; then
            echo "データに変化なし（既に最新）。コミットをスキップします"
            exit 0
          fi
          git add data/yuruverse.sqlite docs/index.html
          git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d') snapshot"
          git push
