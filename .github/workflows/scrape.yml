name: daily-scrape

on:
  schedule:
    # 03:05 UTC = 12:05 JST（ランキングは毎日12時頃更新）
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape and build
        run: |
          python3 scrape.py
          python3 build_site.py

      - name: Commit and push
        run: |
          git config user.name "yuruverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yuruverse.sqlite docs/index.html
          git diff --cached --quiet || git commit -m "data: $(date -u -d '+9 hours' '+%Y-%m-%d') snapshot"
          git push
